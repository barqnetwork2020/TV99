<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>بث مباشر - تجربة hls.js + proxy</title>
<style>
  body{font-family:Segoe UI, Tahoma, sans-serif;background:#111;color:#fff;padding:18px;min-height:100vh}
  .container{max-width:900px;margin:0 auto}
  .video-box{background:#000;border-radius:8px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.6)}
  video{width:100%;height:auto;display:block}
  .info{margin-top:12px;background:rgba(255,255,255,0.03);padding:12px;border-radius:8px}
  .error{color:#ffb3b3}
  button{padding:8px 12px;margin:6px;border-radius:6px;border:0;background:#2b6cff;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="container">
  <h1>اختبار بث — hls.js + proxy</h1>
  <div class="video-box">
    <video id="video" controls playsinline></video>
  </div>

  <div class="info" id="info">
    <p>حالة: <span id="status">جرب التشغيل...</span></p>
    <p class="error" id="err"></p>
    <div style="margin-top:8px;">
      <button id="tryDirect">حاول تشغيل مباشر</button>
      <button id="tryProxy">حاول تشغيل عبر proxy</button>
      <button id="openConsole">فتح تلميحات (تفحص الكونسول)</button>
    </div>
    <p style="margin-top:8px;font-size:90%">ملاحظة: افتح أدوات المطور (F12) > Console لمشاهدة الأخطاء التفصيلية.</p>
  </div>
</div>

<!-- hls.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.8/dist/hls.min.js"></script>
<script>
(() => {
  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');
  const errEl = document.getElementById('err');
  const tryDirectBtn = document.getElementById('tryDirect');
  const tryProxyBtn = document.getElementById('tryProxy');
  const openConsoleBtn = document.getElementById('openConsole');

  // ضع هنا رابط الـ m3u8 الأصلي (HTTP). لا تغيّر باقي الكود
  const ORIGINAL_URL = 'http://141.98.115.53/beINSPORTSSD2/tracks-v1a1/mono.ts.m3u8?token=Time-Match';

  // proxies تجريبية (قد تعمل أو لا حسب قدرة البروكسي على stream وCORS)
  const PROXIES = [
    // تجربة: corsproxy.io أو corsproxy.github أو proxies عامة
    // ملاحظة: بعض هذه الخدمات تقطع البث الحي — إن فشل، راجع الحلول الموضّحة تحت الكود
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => `https://thingproxy.freeboard.io/fetch/${url}`
  ];

  function logStatus(s){ statusEl.textContent = s; console.log('[STATUS]', s); }
  function logError(e){
    errEl.textContent = typeof e === 'string' ? e : (e && e.message) ? e.message : JSON.stringify(e);
    console.error('[ERROR]', e);
  }

  // محاولة تشغيل بمصدر مُعطى (يشمل hls.js للتوافق)
  function playWith(url){
    errEl.textContent = '';
    logStatus('محاولة التشغيل: ' + url);
    // إذا كان المتصفح يدعم HLS natif (Safari iOS/macOS)
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.load();
      video.play().catch(e => logError(e));
      return Promise.resolve();
    }

    // غير ذلك: استخدم hls.js
    if (window.Hls && Hls.isSupported()) {
      // تدمير أي instance سابق
      if (window._hlsInstance) {
        try { window._hlsInstance.destroy(); } catch(e){ /* ignore */ }
        window._hlsInstance = null;
      }
      const hls = new Hls({
        // إعدادات مفيدة للبث الحي
        maxBufferLength: 30,
        liveSyncDuration: 3,
        enableWorker: true
      });
      window._hlsInstance = hls;
      hls.on(Hls.Events.ERROR, function(event, data){
        console.warn('hls error', event, data);
        if (data && data.fatal) {
          logError('خطأ فادح في hls.js — ' + (data.details || data.type));
          // محاولة إعادة التحميل التلقائي
          try { hls.destroy(); } catch(e){}
        }
      });
      hls.attachMedia(video);
      hls.on(Hls.Events.MEDIA_ATTACHED, function(){
        hls.loadSource(url);
        hls.on(Hls.Events.MANIFEST_PARSED, function(){
          video.play().catch(e => logError(e));
          logStatus('قيد التشغيل (hls.js)');
        });
      });
      return Promise.resolve();
    } else {
      const msg = 'المتصفح لا يدعم HLS ومكتبة hls.js غير متاحة';
      logError(msg);
      return Promise.reject(new Error(msg));
    }
  }

  // زر: تجربة التشغيل المباشر (قد يفشل بسبب mixed content أو CORS)
  tryDirectBtn.addEventListener('click', () => {
    // لو الصفحة على HTTPS و ORIGINAL_URL على http -> Mixed content سيمنع المتصفح
    if (location.protocol === 'https:' && ORIGINAL_URL.startsWith('http:')) {
      logError('مصدر غير آمن (HTTP) بينما الصفحة على HTTPS — هذا سَيُمنع تلقائياً. حاول استخدام proxy أو جعل المصدر يدعم HTTPS.');
      return;
    }
    playWith(ORIGINAL_URL).catch(logError);
  });

  // زر: تجربة عبر البروكسيات المُدرجة (يحاول الواحد تلو الآخر حتى ينجح)
  tryProxyBtn.addEventListener('click', async () => {
    for (let i=0;i<PROXIES.length;i++){
      const pUrl = PROXIES[i](ORIGINAL_URL);
      logStatus(`تجربة proxy ${i+1}: ${pUrl}`);
      try {
        await playWith(pUrl);
        // إذا لم يظهر خطأ بعد 6 ثواني اعتبرها ناجحة
        await new Promise((res,rej)=>setTimeout(res,6000));
        if (!errEl.textContent) {
          logStatus('نجح proxy رقم ' + (i+1));
          return;
        }
      } catch(e){
        logError(e);
        // تابع للبروكسي التالي
      }
    }
    logError('فشل كل proxies التجريبية — راجع الحلول أدناه.');
  });

  openConsoleBtn.addEventListener('click', () => {
    alert('افتح أدوات المطور (F12 أو Ctrl+Shift+I) ثم انتقل إلى تبويب Console لعرض تفاصيل الأخطاء.');
  });

  // محاولة تلقائية سريعة عند التحميل: أولاً تحقق mixed content وإلا جرب proxy
  window.addEventListener('load', () => {
    // لو الصفحة HTTPS و المصدر HTTP -> ننتقل مباشرةً إلى proxy
    if (location.protocol === 'https:' && ORIGINAL_URL.startsWith('http:')) {
      logStatus('الصفحة على HTTPS والمصدر على HTTP — سنجرب proxies الآن.');
      tryProxyBtn.click();
    } else {
      // جرب مباشر أولاً
      tryDirectBtn.click();
    }
  });
})();
</script>
</body>
</html>
