<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARQ TV - منصة البث المباشر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FFD700;
            --primary-dark: #FFC400;
            --primary-light: #FFEE58;
            --dark: #0A0A0A;
            --dark-light: #1A1A1A;
            --dark-lighter: #2A2A2A;
            --text: #FFFFFF;
            --text-secondary: #B0B0B0;
            --card-bg: rgba(30, 30, 30, 0.8);
            --glass-bg: rgba(20, 20, 20, 0.7);
            --shadow: 0 8px 32px rgba(255, 215, 0, 0.1);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --gradient: linear-gradient(135deg, #FFD700 0%, #FFC400 100%);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, var(--dark) 0%, #111 100%);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background-attachment: fixed;
        }
        
        /* الشريط العلوي */
        header {
            position: fixed;
            width: 100%;
            top: 0;
            height: 80px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 1000;
            box-shadow: var(--shadow);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 24px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .logo-icon {
            width: 45px;
            height: 45px;
            background: var(--gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark);
            font-size: 22px;
        }
        
        .header-controls {
            display: flex;
            gap: 15px;
        }
        
        .control-btn {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: var(--primary);
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .control-btn:hover {
            background: var(--primary);
            color: var(--dark);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }
        
        /* المحتوى الرئيسي */
        .main-container {
            display: flex;
            margin-top: 80px;
            height: calc(100vh - 80px);
        }
        
        /* القائمة الجانبية */
        .channels-sidebar {
            width: 380px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow-y: auto;
            padding: 25px;
            border-left: 1px solid rgba(255, 215, 0, 0.2);
            transition: var(--transition);
        }
        
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }
        
        .sidebar-title {
            font-size: 22px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .channels-count {
            background: var(--gradient);
            color: var(--dark);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
        }
        
        .search-box {
            position: relative;
            margin-bottom: 25px;
        }
        
        .search-box input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            background: rgba(30, 30, 30, 0.7);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 15px;
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            transition: var(--transition);
        }
        
        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
        }
        
        .search-box i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
        }
        
        .channels-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        
        .channel-card {
            padding: 18px;
            background: var(--card-bg);
            cursor: pointer;
            border-radius: 15px;
            transition: var(--transition);
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }
        
        .channel-card:hover {
            background: rgba(255, 215, 0, 0.1);
            transform: translateX(-5px);
            border-color: var(--primary);
        }
        
        .channel-card.active {
            background: linear-gradient(135deg, var(--card-bg), rgba(255, 215, 0, 0.15));
            border-color: var(--primary);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.2);
        }
        
        .channel-card.active::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 6px;
            height: 100%;
            background: var(--primary);
        }
        
        .channel-logo {
            width: 50px;
            height: 50px;
            background: var(--gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark);
            font-weight: 700;
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .channel-info {
            flex: 1;
        }
        
        .channel-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .channel-category {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .channel-live {
            background: #FF5252;
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 700;
        }
        
        /* منطقة المشغل */
        .player-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--dark);
            position: relative;
            overflow: hidden;
        }
        
        .player-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            position: relative;
        }
        
        .welcome-screen {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: var(--shadow);
        }
        
        .welcome-icon {
            font-size: 80px;
            margin-bottom: 20px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .welcome-text {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .video-wrapper {
            width: 100%;
            max-width: 1000px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            transition: var(--transition);
            display: none;
        }
        
        .video-wrapper.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        video {
            width: 100%;
            height: auto;
            background: #000;
            display: block;
        }
        
        .player-overlay {
            position: absolute;
            bottom: 0;
            right: 0;
            left: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            padding: 30px 25px 20px;
            color: white;
            opacity: 0;
            transition: var(--transition);
        }
        
        .video-wrapper:hover .player-overlay {
            opacity: 1;
        }
        
        .channel-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }
        
        .current-channel {
            font-size: 26px;
            font-weight: 700;
            color: var(--primary);
        }
        
        .player-controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        
        .player-btn {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .player-btn:hover {
            background: var(--primary);
            color: var(--dark);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }
        
        /* حالة التحميل */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }
        
        .loading-spinner {
            width: 70px;
            height: 70px;
            border: 5px solid rgba(255, 215, 0, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* رسالة الخطأ */
        .error-state {
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid rgba(255, 82, 82, 0.5);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin: 20px;
        }
        
        .error-icon {
            font-size: 50px;
            color: #FF5252;
            margin-bottom: 15px;
        }
        
        /* زر إعادة المحاولة */
        .retry-btn {
            background: var(--gradient);
            color: var(--dark);
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .retry-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }
        
        /* شريط التمرير المخصص */
        .channels-sidebar::-webkit-scrollbar {
            width: 8px;
        }
        
        .channels-sidebar::-webkit-scrollbar-track {
            background: var(--dark);
        }
        
        .channels-sidebar::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }
        
        .channels-sidebar::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }
        
        /* تصميم متجاوب */
        @media (max-width: 1200px) {
            .channels-sidebar {
                width: 340px;
            }
        }
        
        @media (max-width: 992px) {
            .main-container {
                flex-direction: column;
            }
            
            .channels-sidebar {
                width: 100%;
                height: 40%;
                border-left: none;
                border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            }
            
            .player-section {
                height: 60%;
            }
            
            .channel-card:hover {
                transform: none;
            }
        }
        
        @media (max-width: 768px) {
            header {
                padding: 0 20px;
                height: 70px;
            }
            
            .logo {
                font-size: 20px;
            }
            
            .logo-icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            
            .sidebar-title {
                font-size: 20px;
            }
            
            .current-channel {
                font-size: 22px;
            }
            
            .welcome-title {
                font-size: 28px;
            }
        }
        
        /* تأثيرات إضافية */
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
        
        /* تأثيرات النص المتلألئ */
        .glow-text {
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>
    <!-- الشريط العلوي -->
    <header>
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-satellite-dish"></i>
            </div>
            <span>BARQ TV</span>
        </div>
        <div class="header-controls">
            <div class="control-btn" title="الإعدادات">
                <i class="fas fa-cog"></i>
            </div>
            <div class="control-btn" title="المفضلة">
                <i class="fas fa-heart"></i>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="main-container">
        <!-- القائمة الجانبية -->
        <div class="channels-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">القنوات المتاحة</div>
                <div class="channels-count" id="channelsCount">0</div>
            </div>
            
            <div class="search-box">
                <input type="text" placeholder="ابحث عن قناة...">
                <i class="fas fa-search"></i>
            </div>
            
            <div class="channels-grid" id="channelsList">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>جاري تحميل القنوات...</p>
                </div>
            </div>
        </div>

        <!-- منطقة المشغل -->
        <div class="player-section">
            <div class="player-container">
                <!-- شاشة الترحيب -->
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">
                        <i class="fas fa-tv"></i>
                    </div>
                    <h1 class="welcome-title">منصة BARQ TV</h1>
                    <p class="welcome-text">
                        اختر قناة من القائمة لبدء البث المباشر. استمتع بتجربة مشاهدة فائقة الجودة مع واجهة حديثة وسريعة.
                    </p>
                    <div class="player-controls" style="justify-content: center;">
                        <button class="player-btn" onclick="scrollToChannels()">
                            <i class="fas fa-list"></i>
                            <span>استعراض القنوات</span>
                        </button>
                    </div>
                </div>
                
                <!-- مشغل الفيديو -->
                <div class="video-wrapper" id="videoWrapper">
                    <video id="videoPlayer" controls></video>
                    <div class="player-overlay">
                        <div class="channel-info">
                            <div class="channel-logo pulse">
                                <i class="fas fa-play"></i>
                            </div>
                            <div class="current-channel" id="currentChannel">اسم القناة</div>
                        </div>
                        <div class="player-controls">
                            <button class="player-btn" onclick="toggleFullscreen()">
                                <i class="fas fa-expand"></i>
                                <span>ملء الشاشة</span>
                            </button>
                            <button class="player-btn" onclick="toggleMute()">
                                <i class="fas fa-volume-up"></i>
                                <span>كتم الصوت</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // رابط JSON
        const jsonUrl = "https://raw.githubusercontent.com/barqnetwork2020/TV99/main/b1.json";
        
        // عناصر DOM
        const channelsList = document.getElementById("channelsList");
        const videoPlayer = document.getElementById("videoPlayer");
        const currentChannelElement = document.getElementById("currentChannel");
        const channelsCountElement = document.getElementById("channelsCount");
        const welcomeScreen = document.getElementById("welcomeScreen");
        const videoWrapper = document.getElementById("videoWrapper");
        
        // تحسين سرعة التحميل - استخدام التخزين المؤقت
        let channelsCache = null;
        
        // تحميل القنوات
        function loadChannels() {
            // إظهار مؤشر التحميل
            channelsList.innerHTML = `
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>جاري تحميل القنوات...</p>
                </div>
            `;
            
            // استخدام التخزين المؤقت إذا كان متاحًا
            if (channelsCache) {
                renderChannels(channelsCache);
                return;
            }
            
            fetch(jsonUrl)
            .then(res => {
                if (!res.ok) {
                    throw new Error(`خطأ في الشبكة: ${res.status}`);
                }
                return res.json();
            })
            .then(data => {
                // تخزين البيانات في الكاش
                channelsCache = data;
                renderChannels(data);
            })
            .catch(err => {
                console.error("خطأ في تحميل القنوات:", err);
                showError(err.message);
            });
        }
        
        // عرض القنوات
        function renderChannels(data) {
            // تحديث عدد القنوات
            channelsCountElement.textContent = data.length;
            
            // إعادة بناء قائمة القنوات
            channelsList.innerHTML = '';
            
            data.forEach((channel, index) => {
                const channelCard = document.createElement("div");
                channelCard.className = "channel-card";
                channelCard.innerHTML = `
                    <div class="channel-logo">${index + 1}</div>
                    <div class="channel-info">
                        <div class="channel-name">${channel.name}</div>
                        <div class="channel-category">قناة تلفزيونية</div>
                    </div>
                    <div class="channel-live">مباشر</div>
                `;
                
                channelCard.onclick = () => {
                    // إزالة النشط من جميع العناصر
                    document.querySelectorAll('.channel-card').forEach(el => {
                        el.classList.remove('active');
                    });
                    
                    // إضافة النشط للعنصر المحدد
                    channelCard.classList.add('active');
                    
                    // إخفاء شاشة الترحيب وإظهار المشغل
                    welcomeScreen.style.display = 'none';
                    videoWrapper.classList.add('active');
                    
                    // تحديث اسم القناة الحالية
                    currentChannelElement.textContent = channel.name;
                    
                    // تشغيل الفيديو بسرعة
                    playChannel(channel.url, channel.name);
                };
                
                channelsList.appendChild(channelCard);
            });
        }
        
        // تشغيل القناة بسرعة
        function playChannel(url, name) {
            // إظهار مؤشر تحميل في المشغل
            currentChannelElement.innerHTML = `${name} <i class="fas fa-spinner fa-spin"></i>`;
            
            // إعداد مصدر الفيديو
            videoPlayer.src = url;
            
            // محاولة التشغيل
            const playPromise = videoPlayer.play();
            
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    // التشغيل نجح
                    currentChannelElement.innerHTML = `${name} <span style="color: var(--primary)"><i class="fas fa-check"></i></span>`;
                }).catch(error => {
                    // حدث خطأ في التشغيل
                    console.error("خطأ في تشغيل الفيديو:", error);
                    currentChannelElement.innerHTML = `${name} <span style="color:#FF5252">(خطأ في التشغيل)</span>`;
                });
            }
        }
        
        // وظائف التحكم بالمشغل
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (videoWrapper.requestFullscreen) {
                    videoWrapper.requestFullscreen();
                } else if (videoWrapper.webkitRequestFullscreen) {
                    videoWrapper.webkitRequestFullscreen();
                } else if (videoWrapper.msRequestFullscreen) {
                    videoWrapper.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
        
        function toggleMute() {
            videoPlayer.muted = !videoPlayer.muted;
            const muteBtn = document.querySelector('.player-btn:nth-child(2)');
            if (videoPlayer.muted) {
                muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i><span>إلغاء الكتم</span>';
            } else {
                muteBtn.innerHTML = '<i class="fas fa-volume-up"></i><span>كتم الصوت</span>';
            }
        }
        
        function scrollToChannels() {
            document.querySelector('.channels-sidebar').scrollIntoView({ behavior: 'smooth' });
        }
        
        // إضافة وظيفة البحث
        document.querySelector('.search-box input').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const channelCards = document.querySelectorAll('.channel-card');
            
            channelCards.forEach(card => {
                const channelName = card.querySelector('.channel-name').textContent.toLowerCase();
                if (channelName.includes(searchTerm)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        });
        
        // عرض رسالة الخطأ
        function showError(message) {
            channelsList.innerHTML = `
                <div class="error-state">
                    <div class="error-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h3>حدث خطأ في تحميل القنوات</h3>
                    <p>${message}</p>
                    <button class="retry-btn" onclick="loadChannels()">
                        <i class="fas fa-redo"></i>
                        إعادة المحاولة
                    </button>
                </div>
            `;
        }
        
        // بدء تحميل القنوات عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', loadChannels);
        
        // إضافة معالجة لأخطاء الفيديو
        videoPlayer.addEventListener('error', function() {
            currentChannelElement.innerHTML = `${currentChannelElement.textContent} <span style="color:#FF5252">(خطأ في التشغيل)</span>`;
        });
        
        // تحسين الأداء - إيقاف الفيديو عند الخروج من الصفحة
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                videoPlayer.pause();
            }
        });
    </script>
</body>
</html>
