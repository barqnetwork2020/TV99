<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BARQ TV Minimal</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body,html{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial, sans-serif;}

    /* الفيديو */
    #playerVideo{
        width:100%;
        height:100%;
        object-fit:cover;
        background:#000;
    }

    /* زر القائمة */
    #menuBtn{
        position:fixed;
        top:14px;
        right:14px;
        width:50px;
        height:50px;
        border-radius:12px;
        background:rgba(255,255,255,0.15);
        border:1px solid rgba(255,255,255,0.25);
        color:#fff;
        font-size:20px;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        z-index:9999;
    }

    /* القائمة */
    #panel{
        position:fixed;
        top:0;
        right:-320px;
        width:300px;
        height:100%;
        background:rgba(20,20,20,0.95);
        padding:15px;
        transition:right .3s;
        z-index:9998;
        overflow-y:auto;
    }
    #panel.open{
        right:0;
    }

    .item{
        padding:12px;
        background:rgba(255,255,255,0.08);
        margin-bottom:10px;
        border-radius:10px;
        color:#fff;
        cursor:pointer;
    }
    .item:hover{background:rgba(255,255,255,0.15);}
</style>
</head>
<body>

<!-- زر القائمة -->
<div id="menuBtn"><i class="fas fa-bars"></i></div>

<!-- القائمة -->
<div id="panel"></div>

<!-- الفيديو -->
<video id="playerVideo" playsinline webkit-playsinline controls></video>

<script>
/* قائمة القنوات */
const channels = [
    { name:"القناة 1", url:"https://www.w3schools.com/html/mov_bbb.mp4" },
    { name:"القناة 2", url:"https://www.w3schools.com/html/movie.mp4" },
    { name:"الأخبار", url:"https://www.w3schools.com/html/mov_bbb.mp4" },
];

/* DOM */
const panel = document.getElementById("panel");
const menuBtn = document.getElementById("menuBtn");
const player = document.getElementById("playerVideo");

/* بناء القائمة */
function renderChannels(){
    panel.innerHTML = "";
    channels.forEach(ch=>{
        let div=document.createElement("div");
        div.className="item";
        div.textContent=ch.name;
        div.onclick=()=>selectChannel(ch);
        panel.appendChild(div);
    });
}
renderChannels();

/* فتح / إغلاق القائمة */
menuBtn.onclick = () => {
    panel.classList.toggle("open");
};

/* اختيار قناة */
function selectChannel(ch){
    panel.classList.remove("open");
    player.src = ch.url;
    player.play().then(()=>requestFS()).catch(()=>{});
}

/* ملء الشاشة */
function requestFS(){
    if(player.requestFullscreen){
        player.requestFullscreen().catch(()=>{});
    } else if(player.webkitEnterFullscreen){
        player.webkitEnterFullscreen();
    }
}

/* فتح القائمة تلقائياً عند تحميل الصفحة */
window.onload = () => {
    panel.classList.add("open");
};
</script>

</body>
</html>
