<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BARQ TV JSON Minimal</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

<!-- تشغيل HLS بدون تقطيع -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;}

    #playerVideo{
        width:100%;
        height:100%;
        object-fit:cover;
        background:#000;
    }

    #menuBtn{
        position:fixed;
        top:14px;
        right:14px;
        width:50px;
        height:50px;
        border-radius:12px;
        background:rgba(255,255,255,0.2);
        border:1px solid rgba(255,255,255,0.25);
        color:#fff;
        font-size:20px;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        z-index:9999;
    }

    #panel{
        position:fixed;
        top:0;
        right:-320px;
        width:300px;
        height:100%;
        background:rgba(20,20,20,0.95);
        padding:15px;
        transition:right .3s;
        z-index:9998;
        overflow-y:auto;
    }
    #panel.open{ right:0; }

    .item{
        padding:12px;
        background:rgba(255,255,255,0.1);
        margin-bottom:10px;
        border-radius:10px;
        color:#fff;
        cursor:pointer;
    }
    .item:hover{ background:rgba(255,255,255,0.2); }
</style>
</head>
<body>

<div id="menuBtn"><i class="fas fa-bars"></i></div>

<div id="panel"></div>

<video id="playerVideo" playsinline webkit-playsinline controls></video>

<script>
/* ================================
   1) رابط ملف JSON
   ضع هنا رابط ملف الجيسون الذي كان في صفحتك السابقة
================================ */
const jsonURL = "channels.json"; // ← غيّره إذا رغبت


/* عناصر DOM */
const panel = document.getElementById("panel");
const player = document.getElementById("playerVideo");
const menuBtn = document.getElementById("menuBtn");

/* فتح/غلق القائمة */
menuBtn.onclick = () => panel.classList.toggle("open");


/* ================
   تحميل ملف JSON
================ */
let channels = [];

fetch(jsonURL)
    .then(r=>r.json())
    .then(data=>{
        channels = data;
        buildChannelList();
        panel.classList.add("open"); // تظهر عند بداية الصفحة
    })
    .catch(e=>{
        console.error("JSON Error:", e);
    });


/* بناء قائمة القنوات */
function buildChannelList(){
    panel.innerHTML = "";
    channels.forEach((ch, i)=>{
        const div = document.createElement("div");
        div.className = "item";
        div.textContent = ch.name || ("قناة " + (i+1));
        div.onclick = ()=>playChannel(ch);
        panel.appendChild(div);
    });
}


/* تشغيل القناة مع نظام منع التقطيع */
function playChannel(ch){
    panel.classList.remove("open");

    const url = ch.url;

    // إذا كان الرابط HLS
    if(url.endsWith(".m3u8")){
        if(Hls.isSupported()){
            const hls = new Hls({
                maxLiveSyncPlaybackRate: 1.5,
                liveSyncDurationCount: 3,
                enableWorker: true,
                lowLatencyMode: true
            });

            hls.loadSource(url);
            hls.attachMedia(player);

            hls.on(Hls.Events.ERROR, function(event, data){
                console.warn("HLS Error:", data);
                if(data.fatal){
                    hls.destroy();
                    setTimeout(()=>playChannel(ch), 2000); // إعادة محاولة
                }
            });
        } else if(player.canPlayType("application/vnd.apple.mpegurl")){
            player.src = url;
        }
    }
    else {
        // MP4
        player.src = url;
    }

    // تشغيل
    player.play()
        .then(()=>requestFS())
        .catch(()=>{});
}


/* طلب ملء الشاشة */
function requestFS(){
    if(player.requestFullscreen){
        player.requestFullscreen().catch(()=>{});
    } else if(player.webkitEnterFullscreen){
        player.webkitEnterFullscreen();
    }
}
</script>

</body>
</html>
