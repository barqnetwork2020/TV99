<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تنبيه: إصدار قديم</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            max-width: 420px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .container h1 {
            color: #d9534f;
            margin-bottom: 15px;
        }
        .container p {
            color: #333;
            line-height: 1.8;
            font-size: 16px;
        }
        .update-btn {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #0275d8;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
        }
        .update-btn:hover {
            background-color: #025aa5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>تنبيه مهم</h1>
        <p>
            أنت تستخدم إصدارًا قديمًا من هذا التطبيق.
            <br>
            قد لا تعمل بعض الميزات بشكل صحيح، كما قد يؤثر ذلك على الأمان والأداء.
        </p>
        <p>
            يُرجى تحديث التطبيق إلى أحدث إصدار لضمان أفضل تجربة استخدام.
        </p>
        <a href="#" class="update-btn">تحديث التطبيق</a>
    </div>
</body>
</html>
